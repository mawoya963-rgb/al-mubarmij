<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المبرمج الحديث | المنصة الشاملة</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f3f4f6;
            --primary-color: #0284c7;
            --card-bg: #1e293b;
        }
        body.light-mode {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --primary-color: #0284c7;
            --card-bg: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            transition: 0.3s;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid #334155;
        }
        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 10px;
            cursor: pointer;
            font-weight: bold;
        }
        nav a:hover, nav a.active {
            color: var(--primary-color);
        }
        .container {
            padding: 30px 20px;
            max-width: 800px;
            margin: auto;
            text-align: center;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        .theme-toggle {
            background: none;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h2>المبرمج الحديث</h2>
        <nav>
            <a onclick="showSection('home')" id="nav-home" class="active">الرئيسية</a>
            <a onclick="showSection('lessons')" id="nav-lessons">الدروس</a>
            <a onclick="showSection('tools')" id="nav-tools">الأدوات</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()">تبديل الوضع</button>
    </header>

    <div class="container">
        <!-- قسم الرئيسية -->
        <div id="home" class="section active">
            <h1>ارتقِ بمهاراتك البرمجية</h1>
            <p>منصة تقنية متكاملة لتعلم البرمجة وتطوير الويب.</p>
            <button onclick="showSection('lessons')">استكشف الدروس</button>
        </div>

        <!-- قسم الدروس -->
        <div id="lessons" class="section">
            <h2>قسم الدروس البرمجية</h2>
            <p>هنا ستجد كافة الدروس والشروحات التقنية المفصلة.</p>
        </div>

        <!-- قسم الأدوات -->
        <div id="tools" class="section">
            <h2>قسم الأدوات البرمجية</h2>
            <p>أدوات ومختبرات الأكواد البرمجية الفورية.</p>
        </div>
    </div>

    <script>
        // دالة التنقل بين الأقسام بسلاسة داخل ملف واحد
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav a').forEach(nav => nav.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            document.getElementById('nav-' + sectionId).classList.add('active');
        }

        // تبديل الوضع (ليلي / نهاري)
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }
    </script>
</body>
</html>
